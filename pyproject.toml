[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specimen-g-code"
version = "0.5.0"
description = "Specimen preparation pipeline — raw data becomes evidence through registered, leakage-safe, bit-reproducible preparation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Galen Chu" }]
keywords = ["data-pipeline", "feature-engineering", "leakage-prevention", "reproducibility", "lineage"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# core stays zero-dependency (manifest, contracts, catalog, assay protocol);
# recipes opt into the blades they need
etl = ["pandas>=2"]
ml = ["scikit-learn>=1.5"]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specimen = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
